<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Library Renamer</title>
<style>
  /* Cores com contraste alto (texto secundario bem mais escuro que antes, para leitura nitida). */
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #0e131b; --muted: #3c4454;
    --border: #d3d8e0; --accent: #1f4fc4; --accent-text: #ffffff;
    --ok: #12693a; --err: #a11d17; --warn: #7a4f00; --row-hover: #eef3ff; --novo: #12693a; --ph: #e6e9ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13161c; --card: #1c2029; --text: #f3f5f9; --muted: #c4cbd8;
      --border: #3a4152; --accent: #8aa9ff; --accent-text: #0d1220;
      --ok: #74e2a4; --err: #ff9b92; --warn: #f5cb63; --row-hover: #262d3b; --novo: #74e2a4; --ph: #2a303c;
    }
  }
  * { box-sizing: border-box; }
  /* Layout em coluna do tamanho da janela: topo fixo e só a lista de jogos rola. */
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden;
         font: 15px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
         text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
  /* Textos pequenos e secundarios um pouco mais encorpados (Segoe fica fino demais nesses tamanhos). */
  .dica, .meta, .local, .sub, .progresso, th, .campos label, footer { font-weight: 500; }
  main { flex: 1; min-height: 0; width: 100%; max-width: 1180px; margin: 0 auto; padding: 16px 5px 8px;
         display: flex; flex-direction: column; }
  #abaFtp, #abaManual { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .card.lista { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 0; }
  .rolagem { flex: 1; min-height: 0; overflow: auto; }
  .rolagem thead th { position: sticky; top: 0; background: var(--card); z-index: 1; }
  .pastas-wrap { max-height: 132px; overflow: auto; }
  .pastas li { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .pastas li .remover { padding: 0 6px; font-size: 12px; line-height: 16px; color: var(--err); }
  .nova-pasta { display: flex; gap: 6px; margin-top: 6px; }
  .nova-pasta input { flex: 1; max-width: 420px; font: 13px Consolas, monospace; }
  .nova-pasta button { padding: 3px 10px; font-size: 13px; }
  .topo { display: flex; align-items: flex-start; gap: 12px; }
  .topo > div:first-child { flex: 1; }
  .topo-acoes { display: flex; gap: 8px; align-items: center; }
  h1 { font-size: 21px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  textarea, input, select { padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border);
                            background: var(--bg); color: var(--text); font: inherit; }
  textarea { width: 100%; min-height: 90px; resize: vertical; font: 14px/1.4 Consolas, monospace; }
  .linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .campos { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .campos label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
  button { border: 1px solid var(--border); background: var(--card); color: var(--text);
           padding: 6px 12px; border-radius: 7px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primario { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .dica { color: var(--muted); font-size: 13px; }
  .progresso { color: var(--muted); font-size: 13px; margin-left: auto; }
  .abas { display: flex; gap: 4px; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .abas button { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 6px 12px; color: var(--muted); }
  .abas button.ativa { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .abas .cache { margin-left: auto; }
  .oculta { display: none !important; }
  .pastas { margin: 6px 0 0; padding-left: 18px; font: 13px Consolas, monospace; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  tbody tr:hover { background: var(--row-hover); }
  td.capa { width: 82px; padding-right: 0; }
  .capa img, .capa .ph { width: 72px; height: 72px; border-radius: 8px; display: block; object-fit: cover; background: var(--ph); }
  .jogo { font-weight: 600; }
  .meta { font-size: 13px; color: var(--muted); }
  .meta a { font-family: Consolas, monospace; }
  .cid { font: 12px Consolas, monospace; color: var(--muted); word-break: break-all; }
  .links { margin-top: 4px; display: flex; gap: 6px; }
  .links button { padding: 2px 8px; font-size: 12px; }
  .arq { font: 13px Consolas, monospace; word-break: break-all; }
  .novo { color: var(--novo); }
  .novo::before { content: "→ "; color: var(--muted); }
  .local { color: var(--muted); font-size: 12px; }
  td.st { width: 1%; white-space: nowrap; text-align: right; }
  td.st button { margin-top: 4px; padding: 3px 10px; font-size: 13px; }
  .filtros { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .filtros button { border: none; border-radius: 0; padding: 4px 12px; font-size: 13px; }
  .filtros button + button { border-left: 1px solid var(--border); }
  .filtros button.ativo { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .renomear { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .ok { color: var(--ok); } .erro { color: var(--err); } .aviso-st { color: var(--warn); } .nomeok { font-weight: 700; }
  .vazio { color: var(--muted); text-align: center; padding: 20px; }
  .erros-pasta { color: var(--err); font-size: 13px; margin: 6px 0 0; }
  footer { flex: none; position: relative; padding: 4px 16px 8px; color: var(--muted); font-size: 12px; text-align: center; }
  /* Selo do desenvolvedor no canto inferior direito. */
  .selo { position: absolute; right: 16px; bottom: 6px; display: inline-flex; align-items: center; gap: 6px;
          padding: 2px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--card);
          color: var(--muted); font-size: 11px; letter-spacing: .02em; }
  .selo b { color: var(--accent); font-weight: 700; }
  a { color: var(--accent); }
  #aviso { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #aviso.visivel { opacity: 1; }
  #encerrado { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center;
               font-size: 17px; color: var(--muted); text-align: center; padding: 16px; }
</style>
</head>
<body>
<main>
  <div class="topo">
    <div>
      <h1 data-i18n="titulo"></h1>
      <p class="sub" data-i18n-html="sub"></p>
    </div>
    <div class="topo-acoes">
      <select id="selIdioma" title="Idioma / Language / Idioma">
        <option value="pt-BR">Português (BR)</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <button id="btnSair" data-i18n="btn_sair"></button>
    </div>
  </div>

  <nav class="abas">
    <button class="ativa" data-aba="abaFtp" data-i18n="aba_ftp"></button>
    <button data-aba="abaManual" data-i18n="aba_manual"></button>
    <span class="dica cache"><span id="baseInfo"></span> · <span id="cacheInfo"></span> · <span id="iconesInfo"></span> · <a href="#" id="lnkLimparCache" data-i18n="limpar_cache"></a></span>
  </nav>

  <!-- ===================== ABA FTP ===================== -->
  <div id="abaFtp">
    <section class="card">
      <div class="campos">
        <label><span data-i18n="lbl_protocolo"></span>
          <select id="ftpProtocolo"><option value="ftp">FTP</option><option value="sftp">SFTP</option></select>
        </label>
        <label><span data-i18n="lbl_host"></span> <input id="ftpHost" placeholder="192.168.0.10" size="20"></label>
        <label><span data-i18n="lbl_porta"></span> <input id="ftpPorta" value="2121" size="5"></label>
        <label><span data-i18n="lbl_usuario"></span> <input id="ftpUsuario" data-i18n-ph="ph_usuario" size="14" autocomplete="off"></label>
        <label><span data-i18n="lbl_senha"></span> <input id="ftpSenha" type="password" size="12" autocomplete="off"></label>
        <button id="btnSalvar" data-i18n="btn_salvar"></button>
        <button id="btnEditarIni" data-i18n="btn_editar_ini" data-i18n-title="tt_editar_ini"></button>
        <button id="btnRecarregar" data-i18n="btn_recarregar" data-i18n-title="tt_recarregar"></button>
        <button class="primario" id="btnConectar" data-i18n="btn_conectar"></button>
        <span class="progresso" id="progFtp"></span>
      </div>
      <p class="dica" style="margin:8px 0 0"><span data-i18n="dica_payload_req"></span> <a href="#" class="lnk-ext" data-tipo="ftpsrv">github.com/ps5-payload-dev/ftpsrv</a></p>
      <p class="dica" style="margin:4px 0 0" data-i18n="dica_payload"></p>
      <p class="dica" style="margin:6px 0 0"><span data-i18n="pastas_dica_1"></span> <code id="caminhoIni">GameLibraryRenamer.ini</code>:</p>
      <div class="pastas-wrap"><ul class="pastas" id="listaPastas"></ul></div>
      <div class="nova-pasta">
        <input id="novaPasta" data-i18n-ph="ph_nova_pasta" autocomplete="off">
        <button id="btnAddPasta" data-i18n="btn_add_pasta"></button>
      </div>
      <div class="erros-pasta" id="errosPasta"></div>
    </section>

    <section class="card lista">
      <div class="linha" style="margin-top:0;margin-bottom:8px">
        <div class="filtros" id="filtrosFtp">
          <button data-filtro="encontrados"></button><button data-filtro="nao"></button><button data-filtro="todos"></button>
        </div>
        <span class="progresso" id="resumoFtp"></span>
        <button class="renomear" id="btnRenomearTodos" style="margin-left:auto" disabled></button>
      </div>
      <div class="rolagem">
        <table>
          <thead><tr><th></th><th data-i18n="th_jogo"></th><th data-i18n="th_arquivo"></th><th style="text-align:right" data-i18n="th_status"></th></tr></thead>
          <tbody id="corpoFtp"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- ===================== ABA MANUAL ===================== -->
  <div id="abaManual" class="oculta">
    <section class="card">
      <textarea id="entrada" data-i18n-ph="ph_entrada"></textarea>
      <div class="linha">
        <button class="primario" id="btnConsultar" data-i18n="btn_consultar"></button>
        <button id="btnLimpar" data-i18n="btn_limpar"></button>
        <button id="btnCopiarTodos" disabled data-i18n="btn_copiar_todos"></button>
        <button id="btnTxt" disabled data-i18n="btn_txt"></button>
        <button id="btnCsv" disabled data-i18n="btn_csv"></button>
        <span class="progresso" id="progresso"></span>
      </div>
    </section>

    <section class="card lista">
      <div class="rolagem">
        <table>
          <thead><tr><th></th><th data-i18n="th_jogo"></th><th data-i18n="th_nome_arquivo"></th><th style="text-align:right" data-i18n="th_status"></th></tr></thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<footer>Game Library Renamer <span id="versao"></span><span class="selo">developed by <b>PristMC</b></span></footer>
<div id="aviso"></div>
<div id="encerrado" data-i18n="encerrado"></div>

let idioma = "pt-BR";

function t(chave, params = {}) {
  const texto = TEXTOS[idioma]?.[chave] ?? TEXTOS["pt-BR"][chave] ?? chave;
  return texto.replace(/\{(\w+)\}/g, (_, p) => params[p] ?? "");
}

// Status que vêm do servidor como texto fixo (em português sem acento) -> chave traduzida.
function tStatus(s) {
  if (!s) return "";
  const fixos = { "ok": "st_ok", "nao encontrado": "st_nao_encontrado", "codigo invalido": "st_codigo_invalido",
                  "servidor local não respondeu": "st_servidor" };
  if (fixos[s]) return t(fixos[s]);
  let m = s.match(/^erro HTTP (\d+)$/);
  if (m) return t("st_erro_http", { n: m[1] });
  m = s.match(/^erro de conexao: (.*)$/);
  if (m) return t("st_erro_conexao", { d: m[1] });
  return s;
}

// Erro devolvido pela API: usa a chave traduzida quando o servidor manda uma.
const tErro = r => (r.chave && TEXTOS["pt-BR"]["e_" + r.chave]) ? t("e_" + r.chave, r.params || {}) : r.erro;

function aplicarIdioma(novo) {
  idioma = TEXTOS[novo] ? novo : "pt-BR";
  document.documentElement.lang = idioma;
  $("selIdioma").value = idioma;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  mostrarBase(ultimaBase); mostrarContadores(); mostrarPastas(ultimasPastas, ultimaSituacao);
  renderizarFtp(); renderizar();
}

function idiomaDoNavegador() {
  const l = (navigator.language || "").toLowerCase();
  return l.startsWith("pt") ? "pt-BR" : l.startsWith("es") ? "es" : "en";
}

const $ = id => document.getElementById(id);
const CAMPOS = ["title_id", "plataforma", "nome", "nome_arquivo", "content_id", "publisher", "publisher_id", "regiao", "url", "icone", "status"];
const PARALELO = 3;      // consultas simultâneas
const PAUSA_MS = 250;    // pausa de cada "fila" após uma consulta que foi ao site
const espera = ms => new Promise(r => setTimeout(r, ms));
let resultados = [];
let ultimaBase = null, ultimasPastas = [], ultimaSituacao = null, contadores = { cache: 0, icones: 0 };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function avisar(msg, ms = 1800) {
  const el = $("aviso");
  el.textContent = msg;
  el.classList.add("visivel");
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => el.classList.remove("visivel"), ms);
}

async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); avisar(t("av_copiado")); }
  catch { avisar(t("av_nao_copiou")); }
}

async function postJson(url, dados) {
  const resp = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dados) });
  return resp.json();
}

// /api/consulta: base local (instantâneo) ou site. /api/detalhes: publisher (sempre do site, com cache).
async function buscarApi(rota, codigo) {
  try {
    const resp = await fetch(`/api/${rota}?codigo=` + encodeURIComponent(codigo));
    return await resp.json();
  } catch {
    return { title_id: codigo, status: "servidor local não respondeu" };
  }
}
const consultarCodigo = codigo => buscarApi("consulta", codigo);
const detalhesCodigo = codigo => buscarApi("detalhes", codigo);

// Busca vários códigos com PARALELO filas ao mesmo tempo; aoReceber(codigo, resultado, feitos, total).
async function consultarLista(codigos, aoReceber, buscar = consultarCodigo) {
  let proximo = 0, feitos = 0;
  async function fila() {
    while (proximo < codigos.length) {
      const codigo = codigos[proximo++];
      const r = await buscar(codigo);
      aoReceber(codigo, r, ++feitos, codigos.length);
      if (!r.cache && proximo < codigos.length) await espera(PAUSA_MS); // não sobrecarregar o site
    }
  }
  await Promise.all(Array.from({ length: Math.min(PARALELO, codigos.length) }, fila));
  await atualizarCache();
}

function mostrarBase(base) {
  ultimaBase = base;
  if (!base) { $("baseInfo").textContent = t("base_carregando"); return; }
  $("baseInfo").textContent = base.situacao === "ok"
    ? t("base_ok", { qtd: base.qtd.toLocaleString(idioma) }) + (base.atualizada_em ? t("base_baixada", { data: base.atualizada_em }) : "")
    : base.situacao === "carregando" ? t("base_carregando") : t("base_indisp");
  $("baseInfo").title = base.erro || "";
}

function mostrarContadores(cfg) {
  if (cfg) contadores = { cache: cfg.cache_qtd, icones: cfg.icones_qtd };
  $("cacheInfo").textContent = t("cache_info", { n: contadores.cache });
  $("iconesInfo").textContent = t("icones_info", { n: contadores.icones });
}

async function atualizarCache() {
  try {
    const cfg = await (await fetch("/api/config")).json();
    if (cfg.ok === false) return;  // INI com erro: o aviso já foi mostrado por carregarConfig
    mostrarContadores(cfg);
    mostrarBase(cfg.base);
    if (cfg.base?.situacao === "carregando") setTimeout(atualizarCache, 2000);
  } catch { /* ignora */ }
}

// Completa o publisher por extenso dos resultados que vieram da base local; aoReceber(codigo, detalhes).
async function completarDetalhes(resultadosBase, aoReceber, progresso) {
  const codigos = [...new Set(resultadosBase.filter(r => r && r.fonte === "base" && !r.icone).map(r => r.title_id))];
  if (!codigos.length) return;
  await consultarLista(codigos, (codigo, d, feitos, total) => {
    if (d.status === "ok") aoReceber(codigo, d);
    progresso.textContent = t("prog_detalhes", { a: feitos, b: total });
  }, detalhesCodigo);
}

// Junta ícone/publisher do site no resultado da base (nome e nome do arquivo continuam os da base).
const juntarDetalhes = (r, d) => ({ ...r, icone: d.icone || r.icone, publisher: d.publisher || r.publisher });

// Células comuns às duas abas: capa e bloco do jogo.
// O ícone vem do servidor local (/icone/CODIGO), que guarda a imagem no computador na primeira vez.
function celCapa(r) {
  return r?.status === "ok"
    ? `<td class="capa"><img src="/icone/${encodeURIComponent(r.title_id)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph'}))"></td>`
    : '<td class="capa"><div class="ph"></div></td>';
}

function celJogo(r, codigo) {
  if (!r || r.status !== "ok") return `<td><div class="meta">${esc(r?.title_id || codigo)}</div></td>`;
  const publisher = r.publisher ? esc(r.publisher) + (r.publisher_id ? ` (${esc(r.publisher_id)})` : "") : esc(r.publisher_id);
  // Link do código: abre no navegador padrão pelo servidor (um <a target=_blank> abriria um pop-up pequeno da janela do app).
  const meta = [`<a href="#" class="lnk-ext" data-tipo="patches" data-codigo="${esc(r.title_id)}">${esc(r.title_id)}</a>`, esc(r.plataforma), esc(r.regiao),
                publisher].filter(Boolean).join(" · ");
  // Fotos e videos: pagina oficial na PlayStation Store (quando a base tem o conceptId) e busca no YouTube.
  const loja = r.concept_id
    ? `<button class="lnk-ext" data-tipo="loja" data-concept="${esc(r.concept_id)}" title="${esc(t("tt_loja"))}">${esc(t("btn_loja"))}</button>` : "";
  const youtube = `<button class="lnk-ext" data-tipo="youtube" data-nome="${esc(r.nome)}" title="${esc(t("tt_youtube"))}">${esc(t("btn_youtube"))}</button>`;
  return `<td><div class="jogo">${esc(r.nome)}</div><div class="meta">${meta}</div><div class="cid">${esc(r.content_id)}</div>`
       + `<div class="links">${loja}${youtube}</div></td>`;
}

try { filtroFtp = localStorage.getItem("filtroFtp") || filtroFtp; } catch { /* sem armazenamento: usa o padrão */ }

const PORTA_PADRAO = { ftp: "2121", sftp: "22" };

// Aceita colar a URL completa (sftp://host:porta) no campo de endereço.
function lerUrlNoHost() {
  const m = $("ftpHost").value.trim().match(/^(s?ftp):\/\/([^\/:]+)(?::(\d+))?\/?$/i);
  if (!m) return;
  $("ftpProtocolo").value = m[1].toLowerCase();
  $("ftpHost").value = m[2];
  $("ftpPorta").value = m[3] || PORTA_PADRAO[m[1].toLowerCase()];
}

function conexao() {
  lerUrlNoHost();
  return { protocolo: $("ftpProtocolo").value, host: $("ftpHost").value.trim(), porta: $("ftpPorta").value.trim(),
           usuario: $("ftpUsuario").value, senha: $("ftpSenha").value };
}

// situacao: [{pasta, existe, qtd, erro}] vinda do Conectar; sem ela as pastas aparecem como "não testada".
function mostrarPastas(pastas, situacao) {
  ultimasPastas = pastas || []; ultimaSituacao = situacao || null;
  const porPasta = Object.fromEntries((situacao || []).map(s => [s.pasta, s]));
  $("listaPastas").innerHTML = ultimasPastas.length
    ? ultimasPastas.map(p => {
        const s = porPasta[p];
        const st = !s ? `<span class="dica">${esc(t("pasta_nao_testada"))}</span>`
          : s.existe ? `<span class="ok">${esc(t("pasta_existe", { n: s.qtd, itens: t(s.qtd === 1 ? "item" : "itens") }))}</span>`
          : `<span class="erro">${esc(t("pasta_nao_existe"))}${s.erro ? ` <span class="dica">(${esc(s.erro)})</span>` : ""}</span>`;
        return `<li><button class="remover" data-pasta="${esc(p)}" title="${esc(t("tit_remover_pasta"))}">✕</button> ${esc(p)} — ${st}</li>`;
      }).join("")
    : `<li class="erro">${esc(t("sem_pastas_ini"))}</li>`;
}

// Inclui/exclui pastas pela tela: grava a lista inteira no INI.
async function gravarPastas(pastas, aviso) {
  const r = await postJson("/api/pastas", { pastas });
  if (!r.ok) { avisar(t("av_erro", { e: tErro(r) }), 4000); return false; }
  // Mantém o resultado do último Conectar para as pastas que continuam na lista.
  mostrarPastas(r.pastas, (ultimaSituacao || []).filter(s => r.pastas.includes(s.pasta)));
  avisar(t(aviso));
  return true;
}

async function adicionarPasta() {
  const pasta = $("novaPasta").value.trim();
  if (!pasta) return;
  if (!pasta.startsWith("/")) { avisar(t("e_pasta_invalida"), 3000); return; }
  if (ultimasPastas.includes(pasta)) { avisar(t("av_pasta_repetida"), 3000); return; }
  if (await gravarPastas([...ultimasPastas, pasta], "av_pasta_incluida")) $("novaPasta").value = "";
}

async function carregarConfig(preencherConexao) {
  const cfg = await (await fetch("/api/config")).json();
  if (cfg.ok === false) {
    // INI com erro (ex.: editado no Bloco de Notas): mostra o problema e mantém a tela como está.
    $("errosPasta").textContent = tErro(cfg);
    avisar(t("av_erro", { e: tErro(cfg) }), 8000);
    return cfg;
  }
  $("errosPasta").textContent = "";
  if (preencherConexao) {
    $("ftpProtocolo").value = cfg.protocolo; $("ftpHost").value = cfg.host; $("ftpPorta").value = cfg.porta;
    $("ftpUsuario").value = cfg.usuario; $("ftpSenha").value = cfg.senha;
  }
  $("caminhoIni").textContent = cfg.arquivo_ini;
  $("versao").textContent = "v" + cfg.versao;
  mostrarContadores(cfg);
  mostrarBase(cfg.base);
  mostrarPastas(cfg.pastas);
  // Enquanto a base local carrega/baixa ao abrir o app, confere de novo a cada 2s.
  if (cfg.base?.situacao === "carregando") setTimeout(atualizarCache, 2000);
  return cfg;
}

function extensao(item) {
  if (item.tipo !== "arquivo") return "";
  const m = item.nome.match(/\.[A-Za-z0-9]{1,5}$/);
  return m ? m[0] : "";
}

// Calcula o novo nome e se o item pode ser renomeado (sem sobrescrever nada).
function recalcular() {
  const existentes = {}, alvos = {};
  for (const it of itensFtp) (existentes[it.pasta] ??= new Set()).add(it.nome);
  for (const it of itensFtp) {
    it.novo = it.info?.status === "ok" ? it.info.nome_arquivo + extensao(it) : "";
    if (it.novo && it.novo !== it.nome) {
      const chave = it.pasta + "\n" + it.novo;
      alvos[chave] = (alvos[chave] || 0) + 1;
    }
  }
  for (const it of itensFtp) {
    if (it.estado === "renomeando") continue;
    if (!it.codigo) { it.estado = "neutro"; it.msg = ["st_sem_codigo"]; continue; }
    if (!it.info || it.info.status === "pendente") { it.estado = "pendente"; it.msg = ["st_consultando"]; continue; }
    if (it.info.status !== "ok") { it.estado = "erro"; it.msg = ["#status", it.info.status]; continue; }
    if (it.novo === it.nome) { it.estado = "feito"; it.msg = [it.renomeado ? "st_nome_ok_agora" : "st_nome_ok"]; continue; }
    if (existentes[it.pasta].has(it.novo)) { it.estado = "conflito"; it.msg = ["st_conflito_existe"]; continue; }
    if (alvos[it.pasta + "\n" + it.novo] > 1) { it.estado = "conflito"; it.msg = ["st_conflito_duplo"]; continue; }
    if (it.erroRenomear) { it.estado = "erro"; it.msg = ["st_falhou", { erro: it.erroRenomear }]; it.pronto = true; continue; }
    it.estado = "pronto"; it.msg = ["st_pronto"];
  }
  renderizarFtp();
}

const textoMsg = msg => !msg ? "" : msg[0] === "#status" ? tStatus(msg[1]) : t(msg[0], msg[1]);

const categoriaFtp = it => !it.codigo || (it.info && !["ok", "pendente"].includes(it.info.status)) ? "nao" : "encontrados";

function renderizarFtp() {
  // Filtro: encontrados (jogo achado, ou ainda consultando) / não encontrados (sem código no nome
  // ou código não encontrado) / todos. Os botões mostram quantos itens há em cada um.
  const contagem = { encontrados: 0, nao: 0, todos: itensFtp.length };
  for (const it of itensFtp) contagem[categoriaFtp(it)]++;
  for (const b of $("filtrosFtp").children) {
    b.textContent = t("filtro_" + b.dataset.filtro, { n: contagem[b.dataset.filtro] });
    b.title = b.dataset.filtro === "nao" ? t("tt_filtro_nao") : "";
    b.classList.toggle("ativo", b.dataset.filtro === filtroFtp);
  }
  // Itens que já estavam com NOME OK ao CONECTAR vão para o final da lista; os demais mantêm a
  // ordem das pastas. Quem foi renomeado agora fica onde está, para dar para ver o novo nome.
  const okAoConectar = it => it.estado === "feito" && !it.renomeado;
  const visiveis = itensFtp.map((it, i) => [it, i]).filter(([it]) => filtroFtp === "todos" || categoriaFtp(it) === filtroFtp)
    .sort(([a, ia], [b, ib]) => okAoConectar(a) - okAoConectar(b) || ia - ib);
  const qtd = s => itensFtp.filter(it => it.estado === s).length;
  $("btnRenomearTodos").textContent = t("btn_renomear_todos", { n: qtd("pronto") });
  $("btnRenomearTodos").disabled = renomeandoTodos || !qtd("pronto");
  $("resumoFtp").textContent = itensFtp.length
    ? t("resumo", { total: itensFtp.length, cod: itensFtp.filter(it => it.codigo).length, prontos: qtd("pronto"), ok: qtd("feito"), conf: qtd("conflito") })
    : "";
  if (!visiveis.length) {
    $("corpoFtp").innerHTML = `<tr><td colspan="4" class="vazio">${esc(t(itensFtp.length ? "vazio_sem_codigo" : "vazio_ftp"))}</td></tr>`;
    return;
  }
  const classe = { pronto: "ok", feito: "ok nomeok", erro: "erro", conflito: "aviso-st", pendente: "dica", neutro: "dica", renomeando: "dica" };
  $("corpoFtp").innerHTML = visiveis.map(([it, i]) => {
    const icone = it.tipo === "pasta" ? "📁" : "📄";
    const podeRenomear = it.estado === "pronto" || (it.estado === "erro" && it.pronto);
    return `<tr>
      ${celCapa(it.info)}
      ${celJogo(it.info, it.codigo)}
      <td>
        <div class="arq">${icone} ${esc(it.nome)}</div>
        ${it.novo && it.novo !== it.nome ? `<div class="arq novo">${esc(it.novo)}</div>` : ""}
        <div class="local">${esc(it.pasta)}</div>
      </td>
      <td class="st"><div class="${classe[it.estado] || ""}">${esc(textoMsg(it.msg))}</div>
        ${podeRenomear ? `<button class="renomear" data-i="${i}">${esc(t("btn_renomear"))}</button>` : ""}</td>
    </tr>`;
  }).join("");
}

async function conectarFtp() {
  const con = conexao();
  if (!con.host) { avisar(t("av_informe_ip")); return; }
  $("btnConectar").disabled = true;
  $("errosPasta").textContent = "";
  $("progFtp").textContent = t("prog_conectando");
  try {
    const r = await postJson("/api/escanear", con);
    if (!r.ok) {
      $("progFtp").textContent = "";
      avisar(t("av_erro", { e: tErro(r) }), 5000);
      $("errosPasta").textContent = t("falha_conexao", { e: tErro(r) });
      return;
    }
    mostrarPastas(r.pastas, r.situacao);
    itensFtp = r.itens.map(it => ({ ...it, info: it.codigo ? (infoPorCodigo[it.codigo] || null) : null }));
    recalcular();

    const codigos = [...new Set(itensFtp.filter(it => it.codigo && !infoPorCodigo[it.codigo]).map(it => it.codigo))];
    const inicio = Date.now();
    await consultarLista(codigos, (codigo, info, feitos, total) => {
      infoPorCodigo[codigo] = info;
      itensFtp.forEach(it => { if (it.codigo === codigo) it.info = info; });
      $("progFtp").textContent = t("prog_jogos", { a: feitos, b: total });
      recalcular();
    });
    const tempoNomes = ((Date.now() - inicio) / 1000).toFixed(1);
    await completarDetalhes(Object.values(infoPorCodigo), (codigo, d) => {
      infoPorCodigo[codigo] = juntarDetalhes(infoPorCodigo[codigo], d);
      itensFtp.forEach(it => { if (it.codigo === codigo) it.info = infoPorCodigo[codigo]; });
      renderizarFtp();
    }, $("progFtp"));
    $("progFtp").textContent = t("prog_concluida", { a: tempoNomes, b: ((Date.now() - inicio) / 1000).toFixed(1) });
  } catch (e) {
    $("progFtp").textContent = "";
    avisar(t("st_servidor"), 4000);
  } finally {
    $("btnConectar").disabled = false;
  }
}

async function renomearItem(i, emLote = false) {
  const it = itensFtp[i];
  it.estado = "renomeando"; it.msg = ["st_renomeando"]; renderizarFtp();
  try {
    const r = await postJson("/api/renomear", { ...conexao(), pasta: it.pasta, de: it.nome, para: it.novo });
    it.estado = "";
    if (r.ok) { it.nome = it.novo; it.renomeado = true; it.erroRenomear = ""; if (!emLote) avisar(t("av_renomeado")); }
    else { it.erroRenomear = tErro(r); }
  } catch {
    it.estado = ""; it.erroRenomear = t("st_servidor");
  }
  recalcular();
  return it.renomeado && !it.erroRenomear;
}

// Renomeia, um de cada vez, todos os itens "pronto para renomear" (a lista fica na mesma ordem).
async function renomearTodos() {
  const fila = itensFtp.map((it, i) => [it, i]).filter(([it]) => it.estado === "pronto").map(([, i]) => i);
  if (!fila.length || !confirm(t("conf_renomear_todos", { n: fila.length }))) return;
  renomeandoTodos = true;
  $("btnConectar").disabled = true;
  let ok = 0;
  try {
    for (const [n, i] of fila.entries()) {
      $("progFtp").textContent = t("prog_renomeando", { a: n + 1, b: fila.length });
      if (itensFtp[i]?.estado === "pronto" && await renomearItem(i, true)) ok++;
    }
  } finally {
    renomeandoTodos = false;
    $("btnConectar").disabled = false;
    $("progFtp").textContent = t("prog_renomeados", { ok, n: fila.length });
    renderizarFtp();
  }
}

$("btnConectar").onclick = conectarFtp;
$("btnRenomearTodos").onclick = renomearTodos;
$("btnSalvar").onclick = async () => {
  const r = await postJson("/api/config", conexao());
  avisar(r.ok ? t("av_salvo") : t("av_erro_salvar", { e: tErro(r) }), 3000);
};
$("btnEditarIni").onclick = async () => {
  const r = await postJson("/api/editar-ini", {});
  if (!r.ok) avisar(t("av_erro", { e: tErro(r) }), 4000);
};
$("btnRecarregar").onclick = () => carregarConfig(true).then(() => avisar(t("av_pastas")));
$("filtrosFtp").addEventListener("click", e => {
  const b = e.target.closest("button[data-filtro]");
  if (!b) return;
  filtroFtp = b.dataset.filtro;
  try { localStorage.setItem("filtroFtp", filtroFtp); } catch { /* só não lembra a escolha */ }
  renderizarFtp();
});
$("btnAddPasta").onclick = adicionarPasta;
$("novaPasta").addEventListener("keydown", e => { if (e.key === "Enter") adicionarPasta(); });
$("listaPastas").addEventListener("click", e => {
  const b = e.target.closest(".remover");
  if (b) gravarPastas(ultimasPastas.filter(p => p !== b.dataset.pasta), "av_pasta_removida");
});
$("ftpHost").addEventListener("change", lerUrlNoHost);
$("ftpProtocolo").onchange = () => {
  // Troca a porta só se ainda estiver na porta padrão do outro protocolo.
  if (Object.values(PORTA_PADRAO).includes($("ftpPorta").value.trim())) $("ftpPorta").value = PORTA_PADRAO[$("ftpProtocolo").value];
};
// Links externos (Loja, YouTube, GitHub do ftpsrv): o servidor monta o link e abre no navegador padrão.
document.addEventListener("click", async e => {
  const b = e.target.closest(".lnk-ext");
  if (!b) return;
  e.preventDefault();
  const r = await postJson("/api/abrir-link", { tipo: b.dataset.tipo, concept_id: b.dataset.concept || "", nome: b.dataset.nome || "",
                                                codigo: b.dataset.codigo || "", idioma });
  if (!r.ok) avisar(t("av_erro", { e: tErro(r) }), 4000);
});
$("corpoFtp").addEventListener("click", e => {
  const b = e.target.closest(".renomear");
  if (b) { b.disabled = true; renomearItem(Number(b.dataset.i)); }
});
["ftpHost", "ftpPorta", "ftpUsuario", "ftpSenha"].forEach(id =>
  $(id).addEventListener("keydown", e => { if (e.key === "Enter") conectarFtp(); }));

/* ======================= Aba manual ======================= */
function extrairCodigos(texto) {
  const achados = texto.toUpperCase().match(/[A-Z]{4}[-_ ]?\d{5}/g) || [];
  return [...new Set(achados.map(c => c.replace(/[-_ ]/, "")))];
}

function renderizar() {
  const ok = resultados.filter(r => r.status === "ok");
  ["btnCopiarTodos", "btnTxt"].forEach(id => $(id).disabled = ok.length === 0);
  $("btnCsv").disabled = resultados.length === 0;
  if (!resultados.length) {
    $("corpo").innerHTML = `<tr><td colspan="4" class="vazio">${esc(t("vazio_manual"))}</td></tr>`;
    return;
  }
  $("corpo").innerHTML = resultados.map((r, i) => {
    const okRow = r.status === "ok";
    return `<tr>
      ${celCapa(r)}
      ${celJogo(r)}
      <td>${okRow ? `<div class="arq">${esc(r.nome_arquivo)}</div>` : ""}</td>
      <td class="st"><div class="${okRow ? "ok" : r.status === "pendente" ? "dica" : "erro"}">${esc(r.status === "pendente" ? t("st_consultando") : tStatus(r.status))}</div>
        ${okRow ? `<button class="copiar" data-i="${i}">${esc(t("btn_copiar"))}</button>` : ""}</td>
    </tr>`;
  }).join("");
}

async function consultarTodos() {
  const codigos = extrairCodigos($("entrada").value);
  if (!codigos.length) { avisar(t("av_sem_codigos")); return; }
  $("btnConsultar").disabled = true;
  resultados = codigos.map(c => ({ title_id: c, status: "pendente" }));
  renderizar();
  const inicio = Date.now();
  await consultarLista(codigos, (codigo, r, feitos, total) => {
    resultados[codigos.indexOf(codigo)] = r;
    $("progresso").textContent = t("prog_consultando", { a: feitos, b: total });
    renderizar();
  });
  const tempoNomes = ((Date.now() - inicio) / 1000).toFixed(1);
  await completarDetalhes(resultados, (codigo, d) => {
    const i = codigos.indexOf(codigo);
    resultados[i] = juntarDetalhes(resultados[i], d);
    renderizar();
  }, $("progresso"));
  const qtdOk = resultados.filter(r => r.status === "ok").length;
  $("progresso").textContent = t("prog_manual_fim", { ok: qtdOk, n: codigos.length, a: tempoNomes, b: ((Date.now() - inicio) / 1000).toFixed(1) });
  $("btnConsultar").disabled = false;
}

function baixar(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = Object.assign(document.createElement("a"), { href: url, download: nome });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const nomesOk = () => resultados.filter(r => r.status === "ok").map(r => r.nome_arquivo).join("\n");

$("btnConsultar").onclick = consultarTodos;
$("entrada").addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) consultarTodos(); });
$("btnLimpar").onclick = () => { $("entrada").value = ""; resultados = []; $("progresso").textContent = ""; renderizar(); };
$("btnCopiarTodos").onclick = () => copiar(nomesOk());
$("btnTxt").onclick = () => baixar("nomes_ps5.txt", nomesOk() + "\n", "text/plain;charset=utf-8");
$("btnCsv").onclick = () => {
  const cel = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const linhas = [CAMPOS.join(";"), ...resultados.map(r => CAMPOS.map(c => cel(r[c])).join(";"))];
  baixar("game_library_renamer.csv", "﻿" + linhas.join("\r\n"), "text/csv;charset=utf-8");
};
$("corpo").addEventListener("click", e => {
  const b = e.target.closest(".copiar");
  if (b) copiar(resultados[b.dataset.i].nome_arquivo);
});
